    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.01), rgba(20,8,15,0.10));
    }
    .heart {
      position: fixed;
      opacity: .18;
      animation: float 10s linear infinite;
      pointer-events: none;
      font-size: 26px;
      z-index: 1;
    }
    @keyframes float {
      from { transform: translateY(110vh) rotate(-20deg); }
      to { transform: translateY(-20vh) rotate(20deg); }
    }
    main {
      z-index: 2;
      text-align: center;
      width: min(92%, 520px);
      padding: 34px 20px 38px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(25, 14, 22, 0.08);
      border-radius: 30px;
      box-shadow: 0 25px 90px rgba(0,0,0,0.42);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    .small {
      color: #f8cfdb;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .symbol {
      font-size: 54px;
      margin: 2px 0 16px;
      filter: drop-shadow(0 0 20px rgba(244,138,176,0.36));
      animation: pulse 2.6s ease-in-out infinite;
    }
    @keyframes pulse { 50% { transform: scale(1.08); } }
    h1 {
      font-family: Georgia, serif;
      font-size: clamp(28px, 8vw, 42px);
      font-weight: 400;
      line-height: 1.2;
      margin: 0 0 24px;
      text-shadow: 0 2px 14px rgba(0,0,0,0.3);
    }
    .timer {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 0 0 26px;
    }
    .unit {
      padding: 18px 4px 14px;
      border-radius: 18px;
      background: rgba(255,255,255,0.11);
      border: 1px solid rgba(255,255,255,0.16);
    }
    .number {
      font-size: clamp(34px, 10vw, 52px);
      font-variant-numeric: tabular-nums;
      font-weight: 300;
      line-height: 1.1;
    }
    .caption {
      font-size: 11px;
      color: #f7bfd2;
      text-transform: uppercase;
      letter-spacing: 1.1px;
      margin-top: 9px;
    }
    .line {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,210,226,0.7), transparent);
      margin: 22px 0;
    }
    .message {
      font-family: Georgia, serif;
      font-size: 21px;
      font-style: italic;
      color: #ffe8f0;
      text-shadow: 0 2px 12px rgba(0,0,0,0.28);
    }
    .date {
      font-size: 13px;
      color: #f0cada;
      margin-top: 15px;
    }
    .finish { display: none; }
    .finished .waiting { display: none; }
    .finished .finish { display: block; }
    #fireworks { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; display: none; }
    .finished ~ #fireworks { display: block; }
    .finished .symbol { display: none; }
    .finished .finish h1 { margin: 0; }
    footer {
      position: fixed;
      bottom: 12px;
      z-index: 2;
      font-size: 11px;
      color: rgba(255, 221, 230, 0.72);
    }
    @media (prefers-reduced-motion: reduce) { .heart, .symbol { animation: none; } }
  </style>
</head>
<body>
  <span class="heart" style="left:8%;animation-delay:-2s">♥</span>
  <span class="heart" style="left:78%;animation-delay:-6s;font-size:40px">♥</span>
  <span class="heart" style="left:42%;animation-delay:-9s;font-size:18px">♥</span>

  <main id="main">
    
    <div class="symbol">🥰⏳❤️</div>

    <div class="waiting">
      <h1>…než se zase<br>uvidíme.</h1>
      <section class="timer" aria-label="Zbývající čas">
        <div class="unit"><div class="number" id="h">00</div><div class="caption">Hodiny</div></div>
        <div class="unit"><div class="number" id="m">00</div><div class="caption">Minuty</div></div>
        <div class="unit"><div class="number" id="s">00</div><div class="caption">Sekundy</div></div>
      </section>
      <div class="line"></div>
      
      <div class="date" id="meetingDate"></div>
    </div>

    <div class="finish"><h1>Konečně zase spolu! ❤️</h1></div>
  </main>

  <canvas id="fireworks" aria-hidden="true"></canvas>
  

  <script>
    let end = null;
    let revision = null;
    let animationCycle = 0;
    async function loadCountdown() {
      try {
        const response = await fetch('./countdown.json?t=' + Date.now(), {cache:'no-store'});
        if (!response.ok) throw new Error('Konfigurace nedostupná');
        const config = await response.json();
        const newEnd = Date.parse(config.endsAt);
        if (!Number.isFinite(newEnd)) throw new Error('Neplatné datum');
        if (end !== newEnd) {
          end = newEnd;
          animationCycle++;
          celebrating = false;
          const canvas = document.getElementById('fireworks');
          canvas.style.display = 'none';
          canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
          document.getElementById('main').classList.remove('finished');
          const format = new Intl.DateTimeFormat('cs-CZ', {
            timeZone:'Europe/Prague', day:'numeric', month:'long',
            hour:'2-digit', minute:'2-digit'
          });
          document.getElementById('meetingDate').textContent = format.format(end);
          update();
        }
      } catch (error) {
        console.error('Countdown:', error);
      }
    }
    const pad = n => String(n).padStart(2, '0');
    let celebrating = false;
    function launchFireworks() {
      if (celebrating) return;
      celebrating = true;
      const cycle = animationCycle;
      const canvas = document.getElementById('fireworks');
      const ctx = canvas.getContext('2d');
      canvas.style.display = 'block';
      let particles = [], lastBurst = 0;
      const colors = ['#ffcf69','#ff769a','#ffffff','#bfaaff','#90e4ef','#ff9e76'];
      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(innerWidth * dpr);
        canvas.height = Math.round(innerHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();
      function burst() {
        const x = innerWidth * (0.15 + Math.random() * 0.7);
        const y = innerHeight * (0.13 + Math.random() * 0.48);
        const color = colors[Math.floor(Math.random() * colors.length)];
        for (let i=0; i<42; i++) {
          const angle = (Math.PI * 2 * i / 42) + Math.random() * 0.12;
          const speed = 1.3 + Math.random() * 3;
          particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1,color,size:1.5+Math.random()*2});
        }
      }
      function frame(now) {
        if (cycle !== animationCycle) return;
        ctx.clearRect(0,0,innerWidth,innerHeight);
        if (now-lastBurst>700) { burst(); lastBurst=now; }
        particles = particles.filter(p=>p.life>0);
        particles.forEach(p=>{
          p.x+=p.vx; p.y+=p.vy; p.vy+=0.025; p.life-=0.013;
          ctx.globalAlpha = Math.max(0,p.life);
          ctx.fillStyle=p.color;
          ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
        });
        ctx.globalAlpha=1;
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }
    function update() {
      if (end === null) return;
      let ms = end - Date.now();
      if (ms <= 0) {
        document.getElementById('main').classList.add('finished');
        launchFireworks();
        return;
      }
      let sec = Math.ceil(ms / 1000);
      document.getElementById('h').textContent = pad(Math.floor(sec / 3600));
      document.getElementById('m').textContent = pad(Math.floor((sec % 3600) / 60));
      document.getElementById('s').textContent = pad(sec % 60);
    }
    loadCountdown();
    setInterval(update, 200);
    setInterval(loadCountdown, 60000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) loadCountdown();
    });
  </script>
</body>
</html>
